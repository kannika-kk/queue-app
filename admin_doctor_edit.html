{% extends "base.html" %}
{% block title %}Edit Doctor{% endblock %}
{% block content %}
<div class="card">
  <h1>Edit Doctor</h1>
  <form method="POST" action="{{ url_for('edit_doctor', doctor_id=doc.id) }}">
    {% include "_doctor_form.html" %}
    <button type="submit">Save changes</button>
    <a class="btn btn-secondary" href="{{ url_for('admin') }}">Cancel</a>
  </form>
</div>
{% endblock %}
