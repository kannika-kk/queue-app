{% extends "base.html" %}
{% block title %}Rename {{ L.service }}{% endblock %}
{% block content %}
<div class="card">
  <h1>Rename {{ L.service }}</h1>
  <form method="POST" action="{{ url_for('edit_service', service_id=svc.id) }}">
    <label>Name</label>
    <input type="text" name="name" required maxlength="60" value="{{ svc.name }}">
    <button type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('admin') }}">Cancel</a>
  </form>
</div>
{% endblock %}
