{# Shared add/edit doctor fields. 'doc' is a dict (edit) or None (add). #}
{% set sel_days = doc.days.split(',') if doc else ['Mon','Tue','Wed','Thu','Fri','Sat'] %}
<label>Doctor name</label>
<input type="text" name="name" required maxlength="100" placeholder="Dr. Full Name" value="{{ doc.name if doc else '' }}">
<label>Type</label>
<select name="doctor_type">
  <option value="General" {{ 'selected' if doc and doc.doctor_type == 'General' }}>General physician</option>
  <option value="Specialist" {{ 'selected' if doc and doc.doctor_type == 'Specialist' }}>Specialist</option>
</select>
<label>Specialty</label>
<input type="text" name="specialty" maxlength="60" placeholder="e.g. Cardiology (General Medicine if left empty for General)" value="{{ doc.specialty if doc else '' }}">
<label>Working days</label>
<div class="days-row">
  {% for d in day_names %}
  <label class="day-pill"><input type="checkbox" name="days" value="{{ d }}" {{ 'checked' if d in sel_days }}> {{ d }}</label>
  {% endfor %}
</div>
<div class="time-row">
  <div><label>From</label><input type="time" name="start_time" required value="{{ doc.start_time if doc else '09:00' }}"></div>
  <div><label>To</label><input type="time" name="end_time" required value="{{ doc.end_time if doc else '13:00' }}"></div>
</div>
